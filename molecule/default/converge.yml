---
- name: Converge Default
  hosts: all:!instance-ubuntu-2204-pg17
  become: true
  gather_facts: true

  roles:
    - role: ansible-role-postgres
      postgres_databases:
        - name: test
          owner: test
      postgres_users:
        - name: test
          password: test

- name: Converge Custom Version
  hosts: instance-ubuntu-2204-pg17
  become: true
  gather_facts: true

  roles:
    - role: ansible-role-postgres
      postgres_version: 17
      postgres_databases:
        - name: test
          owner: test
      postgres_users:
        - name: test
          password: test
