---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Remove postgres database
      community.postgresql.postgresql_db:
        name: test
        state: absent
      become_user: postgres
      become: true

    - name: Remove postgres users
      community.postgresql.postgresql_user:
        name: test
        state: absent
      become_user: postgres
      become: true
