---
# defaults file for postgres

# The port to listen to.
postgres_port: 5432

# The interface (address) to listen to. Set to "0.0.0.0" to listen on all interfaces.
postgres_listen_addresses: "127.0.0.1"

postgres_max_wal_size: 1GB
postgres_min_wal_size: 80MB
postgres_log_timezone: UTC
postgres_datestyle: iso, ymd
postgres_timezone: UTC
postgres_default_text_search_config: pg_catalog.english

postgres_hba_entries:
  - type: local
    database: all
    user: all
    method: peer
  - type: host
    database: all
    user: all
    address: "127.0.0.1/32"
    method: ident
  - type: host
    database: all
    user: all
    address: "::1/128"
    method: ident
  - type: local
    database: replication
    user: all
    method: peer
  - type: host
    database: replication
    user: all
    address: "127.0.0.1/32"
    method: ident
  - type: host
    database: replication
    user: all
    address: "::1/128"
    method: ident

postgres_version: "{{ _postgres_version[ansible_distribution].get(ansible_distribution_major_version, _postgres_version[ansible_distribution]['default']) }}"

# If true (default) the role will install and initialize PostgreSQL server packages,
# create data directory and manage the postgres service. Set to false to use the
# role only for creating users/databases on an existing PostgreSQL installation.
postgres_manage_install: true
